<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="O saldo de cada código subindo">
  <!-- Cena do Login do Ascent, na linguagem das cenas do Visto (public/images/cena-*.svg@f66a6c3):
       neutros escuros, a grade sutil e um acento em Delp Red. A composição fica na faixa central:
       a esquerda é a área de texto do hero e a direita fica sob o painel de 480px. -->
  <defs>
    <radialGradient id="fundo" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <pattern id="grade" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="subida" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A00D24"/>
      <stop offset="100%" stop-color="#CC0F10"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#fundo)"/>
  <rect width="1600" height="1000" fill="url(#grade)"/>

  <g transform="translate(48 124) scale(0.8)">
    <!-- Duas folhas ao fundo: a planilha de saldo, atualizada todo dia. -->
    <g stroke="#EAE5DF" stroke-opacity="0.18" fill="#111111" stroke-width="3">
      <rect x="620" y="150" width="440" height="600" rx="10" transform="rotate(-6 840 450)"/>
      <rect x="640" y="160" width="440" height="600" rx="10" transform="rotate(-3 860 460)"/>
    </g>

    <!-- Folha da frente: o avanço de cada código de tarefa. -->
    <rect x="660" y="170" width="440" height="600" rx="10" fill="#141414" stroke="#EAE5DF" stroke-opacity="0.22" stroke-width="3"/>
    <rect x="710" y="230" width="220" height="18" rx="9" fill="#EAE5DF" fill-opacity="0.22"/>
    <rect x="710" y="268" width="140" height="12" rx="6" fill="#EAE5DF" fill-opacity="0.12"/>

    <g fill="#EAE5DF">
      <rect x="710" y="330" width="120" height="12" rx="6" fill-opacity="0.14"/>
      <rect x="710" y="354" width="340" height="14" rx="7" fill-opacity="0.08"/>
      <rect x="710" y="400" width="96" height="12" rx="6" fill-opacity="0.14"/>
      <rect x="710" y="424" width="340" height="14" rx="7" fill-opacity="0.08"/>
      <rect x="710" y="470" width="132" height="12" rx="6" fill-opacity="0.14"/>
      <rect x="710" y="494" width="340" height="14" rx="7" fill-opacity="0.08"/>
      <rect x="710" y="540" width="108" height="12" rx="6" fill-opacity="0.14"/>
      <rect x="710" y="564" width="340" height="14" rx="7" fill-opacity="0.08"/>
    </g>
    <!-- O saldo de cada código, subindo. -->
    <g fill="url(#subida)" fill-opacity="0.9">
      <rect x="710" y="354" width="122" height="14" rx="7"/>
      <rect x="710" y="424" width="190" height="14" rx="7"/>
      <rect x="710" y="494" width="252" height="14" rx="7"/>
      <rect x="710" y="564" width="306" height="14" rx="7"/>
    </g>
    <rect x="710" y="640" width="200" height="56" rx="10" fill="none" stroke="#EAE5DF" stroke-opacity="0.16" stroke-width="3"/>
    <rect x="736" y="660" width="148" height="16" rx="8" fill="#EAE5DF" fill-opacity="0.14"/>

    <!-- Selo: a marca do Ascent (os três triângulos em escada sobre a base) num círculo tracejado. -->
    <g transform="translate(1010 640)">
      <circle r="150" fill="#0B0B0B" fill-opacity="0.85" stroke="#CC0F10" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="10 12"/>
      <g transform="translate(-104 85) scale(0.2)">
        <path d="M0,-40 L300,-40 L150.0,-310.0 Z" fill="#CC0F10" stroke="#CC0F10" stroke-width="27" stroke-linejoin="round"/>
        <path d="M250,-230 L630,-230 L440.0,-572.0 Z" fill="#CC0F10" stroke="#CC0F10" stroke-width="34" stroke-linejoin="round"/>
        <path d="M560,-440 L1040,-440 L800.0,-872.0 Z" fill="#CC0F10" stroke="#CC0F10" stroke-width="43" stroke-linejoin="round"/>
        <rect x="-20" y="-20" width="1080" height="40" rx="20" fill="#EAE5DF"/>
      </g>
    </g>
  </g>
</svg>
